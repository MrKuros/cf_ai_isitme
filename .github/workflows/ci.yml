name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the one still running on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npx oxfmt --check .
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      # Catches wrangler.jsonc mistakes (bindings, migrations) without deploying.
      - run: npx wrangler deploy --dry-run
      # Boots dev:local and asserts every route's status and shape. src/server.ts
      # has no unit test; this is what covers the route table and the SPA fallback.
      - run: npm run smoke
