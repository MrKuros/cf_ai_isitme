name: Deploy

# Ships main to Cloudflare once CI is green, then proves the deployment answers.
# Needs a CLOUDFLARE_API_TOKEN repo secret (Workers Scripts:Edit). Without it the
# job no-ops instead of failing, so forks and the submission mirror stay quiet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MrKuros/isitme' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE: https://cf-ai-isitme.patelkashishpatel032.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      # npm run deploy = vite build && wrangler deploy. Calling wrangler alone
      # ships a Worker with no client assets, so every page 404s.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy

      # A deploy that returns 500 on every check is worse than no deploy.
      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          # A cold Worker plus a real multi-region check can take a while, so every
          # call gets a generous timeout and one retry before it counts as a failure.
          get() { curl -sS --max-time 180 --retry 2 --retry-all-errors "$@"; }

          code=$(get -o /dev/null -w '%{http_code}' "$SITE/")
          test "$code" = 200 || { echo "home returned $code"; exit 1; }

          verdict=$(get "$SITE/api/v1/check?url=example.com" | jq -r '.verdict // "none"')
          echo "example.com -> $verdict"
          case "$verdict" in
            # No INCONCLUSIVE: that is "no vantage answered", not a healthy site.
            HEALTHY|SLOW|PARTIAL) ;;
            *) echo "unexpected verdict for a healthy site"; exit 1 ;;
          esac

          # The SSRF guard is the one thing that must never regress in production.
          guard=$(get -o /dev/null -w '%{http_code}' "$SITE/api/v1/check?url=http://169.254.169.254")
          test "$guard" = 400 || { echo "guard returned $guard, expected 400"; exit 1; }

      # The chat path needs the real Workers AI, which dev:local can't provide, so this drives
      # the deployed app in a real browser. It lives here, after the smoke test, because here it
      # tests the build that was just shipped and can therefore gate.
      - name: Browser end-to-end test
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          E2E_URL: ${{ env.SITE }}
          E2E_OUT: ${{ runner.temp }}
        # Playwright is not a project dependency: it carries a browser download.
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v7
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-*.png
          if-no-files-found: ignore

      - name: Explain the no-op
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; skipping deploy."
