version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the noise down; CI proves each batch.
      cloudflare:
        patterns: ["agents", "@cloudflare/*", "wrangler", "workers-ai-provider"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "@vitejs/*"]
      tooling:
        patterns: ["vite", "vitest", "typescript", "oxlint", "oxfmt", "vitepress*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
